events {}

http {
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # Backend pool (Docker DNS resolves `app`, including scaled replicas)
    upstream cpp_cluster {
        zone cpp_cluster 64k;
        server app:5000 resolve;
    }

    server {
        listen 80;

        location / {
            # Proxy all traffic to the backend pool
            proxy_pass http://cpp_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection close; # avoid sticky keep-alive for demo clarity
        }
    }
}