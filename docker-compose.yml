services:
  app:
    build: .
    deploy:
      replicas: 2
    depends_on:
      - redis
    networks:
      - backend

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - backend

  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data
    networks:
      - backend

networks:
  backend:

# Persist Redis data between restarts
volumes:
  redis_data: